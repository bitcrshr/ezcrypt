[package]
name = "ezcrypt-link"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
rand = "0.8"
subtle = "2"
thiserror = "2"
iroh = "1.5"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
