[package]
name = "ezcrypt-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
ezcrypt-core = { path = "../ezcrypt-core" }
ssh-key = { version = "0.6.7", features = ["ed25519", "p256", "p384", "p521", "encryption", "getrandom"] }
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
signature = "2.2"
p256 = { version = "0.13.2", features = ["ecdh", "ecdsa"] }
