name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      # Native runners build the musl targets, so the distro's musl-gcc is
      # enough for the C parts of the dependency tree; no cross toolchain.
      - name: Install musl tools
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
          # .cargo/config.toml moves the target dir out of ./target.
          workspaces: ". -> .build/rust"
      # Default features only. Never use --all-features: the ezcrypt-cli
      # `test-hooks` feature adds a flag that skips secret handling and must
      # not ship in release binaries.
      - name: Build
        run: cargo build --locked --release -p ezcrypt-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: sh install/package.sh ${{ matrix.target }} dist
      - name: Package .deb
        if: contains(matrix.target, 'linux-musl')
        run: sh install/package-deb.sh dist/ezcrypt-${{ matrix.target }}.tar.gz "${GITHUB_REF_NAME#v}" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ezcrypt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Runs the real installers against the just-built artifacts.
  smoke-linux-macos:
    name: install.sh smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ezcrypt-${{ matrix.target }}
          path: dist
      - name: Install from local artifacts
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum ezcrypt-* > SHA256SUMS; else shasum -a 256 ezcrypt-* | sed 's/ \*/  /' > SHA256SUMS; fi
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          cd ..
          EZCRYPT_BASE_URL=http://127.0.0.1:8000 sh install/install.sh
          v=$("$HOME/.local/bin/ezcrypt" --version)
          echo "$v"
          case "$v" in *"${GITHUB_REF_NAME#v}"*) ;; *) echo "version '$v' does not contain '${GITHUB_REF_NAME#v}'" >&2; exit 1 ;; esac

  smoke-deb:
    name: .deb smoke (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, arch: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: arm64 }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ezcrypt-${{ matrix.target }}
          path: dist
      - name: Install, run, and remove on Ubuntu
        env:
          DEB: dist/ezcrypt-${{ matrix.arch }}.deb
        run: |
          dpkg-deb --info "$DEB"
          sudo apt-get install -y "./$DEB"
          v=$(/usr/bin/ezcrypt --version)
          echo "$v"
          case "$v" in *"${GITHUB_REF_NAME#v}"*) ;; *) echo "version '$v' does not contain '${GITHUB_REF_NAME#v}'" >&2; exit 1 ;; esac
          sudo apt-get remove -y ezcrypt
          if [ -e /usr/bin/ezcrypt ]; then echo "/usr/bin/ezcrypt left behind after remove" >&2; exit 1; fi
      # The oldest dpkg the package targets.
      - name: Install and run on Debian 12
        run: docker run --rm -v "$PWD/dist:/dist:ro" debian:12-slim sh -c 'dpkg -i /dist/ezcrypt-${{ matrix.arch }}.deb && ezcrypt --version'

  smoke-windows:
    name: install.ps1 smoke (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ezcrypt-${{ matrix.target }}
          path: dist
      - name: Install from local artifacts
        shell: pwsh
        run: |
          Set-Location dist
          Get-ChildItem ezcrypt-* | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8000' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 2
          Set-Location ..
          try {
            $env:EZCRYPT_BASE_URL = 'http://127.0.0.1:8000'
            & ./install/install.ps1
            $v = & "$env:LOCALAPPDATA\Programs\ezcrypt\ezcrypt.exe" --version
            Write-Host $v
            $want = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($v -notmatch [regex]::Escape($want)) { throw "version '$v' does not contain '$want'" }
          } finally {
            Stop-Process -Id $server.Id -Force
          }

  publish:
    name: publish release
    needs: [build, smoke-linux-macos, smoke-deb, smoke-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ezcrypt-*
          path: dist
          merge-multiple: true
      - name: Collect release files
        run: |
          cp install/install.sh install/install.ps1 dist/
          cd dist
          sha256sum ezcrypt-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # Assets are attached at creation so releases/latest/download never 404s.
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $flags
