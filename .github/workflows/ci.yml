name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check

  apple:
    name: apple
    # The iOS build needs Xcode 26 or newer, which the macos-26 image provides.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: extractions/setup-just@v2
      - uses: Swatinem/rust-cache@v2
      - run: just test-core
      - run: just check-device

  trust:
    name: trust (container end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - uses: extractions/setup-just@v2
      # The Justfile selects zsh as its shell, which ubuntu runners lack.
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: Swatinem/rust-cache@v2
      - run: just test-trust

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The binary is used directly: the gitleaks action needs a licence for
      # organisation repositories. Findings reviewed as false positives are
      # listed in .gitleaksignore.
      - name: Scan full history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --log-opts="--all" --redact
